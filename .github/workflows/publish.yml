name: NEO Menü auf Hetzner veröffentlichen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neo-hetzner-menu
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: hetzner-menu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Menü prüfen
        run: python -m unittest discover -s tests -v
      - name: Menü erstellen
        run: python scripts/build_site.py
      - name: Auf Hetzner übertragen
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
          HETZNER_MENU_DIR: ${{ secrets.HETZNER_MENU_DIR }}
        run: python scripts/deploy_hetzner.py
